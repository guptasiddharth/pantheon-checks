name: uptime

# Watches the hosted relay from outside, every 5 minutes, while every laptop sleeps.
#
# One run checks every 5 minutes for almost 6 hours (a job's limit), then starts the
# next run itself, so watching does not depend on GitHub starting scheduled runs on
# time (it ran none for hours after this workflow was added). The schedule below only
# restarts the chain if it ever breaks; a run that finds another one going waits.
#
# One alert per outage, not one per check: when the relay is down an issue labelled
# relay-down is opened (GitHub tells the repo's owner by email and on the mobile app);
# while it stays down nothing more is sent; when it is back the issue is closed with
# the time.
#
# Note: GitHub stops scheduled workflows in a public repository after 60 days with no
# commit to it; the chain does not depend on the schedule, but look at the Actions tab
# when a release goes out all the same.

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "how long this run keeps watching before it starts the next one"
        default: "345"
        required: false

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-24.04
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: watch the relay
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MINUTES: ${{ inputs.minutes || '345' }}
        run: |
          gh label create relay-down --color B60205 --description "the hosted relay is not answering" 2>/dev/null || true
          end=$((SECONDS + MINUTES * 60))
          while :; do
            started=$SECONDS
            STATE_FILE="$RUNNER_TEMP/state" node uptime.mjs || echo "down: the check itself failed" > "$RUNNER_TEMP/state"
            STATE=$(cat "$RUNNER_TEMP/state")
            open=$(gh issue list --label relay-down --state open --json number --jq '.[0].number // empty' || true)
            now=$(date -u +"%Y-%m-%d %H:%M UTC")
            if [ "$STATE" = "up" ]; then
              if [ -n "$open" ]; then gh issue close "$open" --comment "Back up at ${now}." || true; fi
            elif [ -z "$open" ]; then
              gh issue create --label relay-down --title "Relay down since ${now}" --body "${STATE}

          Checked from GitHub's machines (three tries, about 40 s apart). This issue closes itself when the relay answers again." || true
            fi
            [ $SECONDS -ge $end ] && break
            wait=$((300 - (SECONDS - started)))
            [ $wait -gt 0 ] && sleep $wait
          done
      # Only after a whole watch: a run that failed at once must not start the next at
      # once (a loop of runs); the schedule restarts the chain instead.
      - name: start the next run
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run uptime.yml -R "${{ github.repository }}"
